host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://localhost:8080
  description: RESTful API Service built with Golang, Clean Code, and SOLID principles.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: MBG Backend API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Authenticate user and issue tokens
  /api/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Revoke the current refresh token
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Return the authenticated user profile and permissions
  /api/auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Rotate refresh token and issue a new access token
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: registration data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Create a new validator/siswa account
  /api/health:
    get:
      description: Returns status and timestamp of the backend service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.HealthResponse'
              type: object
      summary: Check service health
      tags:
      - health
  /api/items:
    get:
      description: Get list of all items from repository
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Item'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Get all items
      tags:
      - items
    post:
      consumes:
      - application/json
      description: Create a new item with title, description, and category
      parameters:
      - description: Create Item Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Item'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Create a new item
      tags:
      - items
  /api/items/{id}:
    delete:
      description: Delete an item by its unique ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Delete item by ID
      tags:
      - items
    get:
      description: Get a single item by its unique ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Item'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Get item by ID
      tags:
      - items
  /api/nutrition/items:
    get:
      parameters:
      - description: kata kunci nama bahan
        in: query
        name: q
        type: string
      - description: batas hasil (default 20, maks 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Search nutrition items from the cuisine dataset
  /api/scans:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: foto isi boks (jpg/png, maks 8MB)
        in: formData
        name: image
        required: true
        type: file
      - description: token QR boks berformat MBG-...
        in: formData
        name: qrToken
        type: string
      - description: id boks (diturunkan dari token QR bila kosong)
        in: formData
        name: boxId
        type: string
      - description: id batch
        in: formData
        name: batchId
        type: string
      - description: suhu holding boks (°C)
        in: formData
        name: holdingTempC
        type: number
      - description: suhu masak inti saat lepas dapur (°C)
        in: formData
        name: releaseTempC
        type: number
      - description: lama inspeksi visual dalam milidetik (audit ketelitian Pasal
          14)
        in: formData
        name: durationMs
        type: integer
      - description: daftar bahan menu (format 'Nama:gram' dipisah koma, mis. 'Nasi:120,Ayam
          goreng paha:60')
        in: formData
        name: items
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ScanResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Submit a box scan (QR token + food photo) for AI quality analysis
  /api/scans/recent:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: List the most recent scan logs
  /sppg:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.SPPGKitchen'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Direktori dapur SPPG
      tags:
      - sppg
  /sppg/{id}:
    get:
      parameters:
      - description: SPPG ID
        example: SPPG-01
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.SPPGKitchen'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Detail satu dapur SPPG
      tags:
      - sppg
  /sppg/{id}/quota:
    put:
      consumes:
      - application/json
      description: Superadmin saja. Kuota tidak boleh melebihi maxDailyPortions.
      parameters:
      - description: SPPG ID
        in: path
        name: id
        required: true
        type: string
      - description: Kuota baru + alasan
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.UpdateQuotaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.SPPGKitchen'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Perbarui kuota produksi
      tags:
      - sppg
  /sppg/{id}/recipe-audit:
    post:
      consumes:
      - application/json
      parameters:
      - description: SPPG ID
        in: path
        name: id
        required: true
        type: string
      - description: Hasil audit
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.RecordRecipeAuditRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.SPPGKitchen'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Audit gramatur resep TKPI
      tags:
      - sppg
  /sppg/{id}/reinstate:
    post:
      consumes:
      - application/json
      description: Superadmin saja. Mengembalikan status dapur menjadi active dan
        menetapkan kuota awal.
      parameters:
      - description: SPPG ID
        in: path
        name: id
        required: true
        type: string
      - description: Alasan pemulihan + kuota awal
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.ReinstateKitchenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.SPPGKitchen'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Pulihkan hak operasional dapur SPPG
      tags:
      - sppg
  /sppg/{id}/suspension:
    post:
      consumes:
      - application/json
      description: Superadmin saja. Wajib menunjuk dapur alternatif yang aktif dan
        mampu.
      parameters:
      - description: SPPG ID
        in: path
        name: id
        required: true
        type: string
      - description: Alasan + dapur alternatif
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.SuspendKitchenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.SPPGKitchen'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Bekukan dapur SPPG
      tags:
      - sppg
  /sppg/{id}/warnings:
    post:
      consumes:
      - application/json
      description: Superadmin saja. SP-2 hanya sah bila SP-1 sebelumnya sudah terbit.
      parameters:
      - description: SPPG ID
        in: path
        name: id
        required: true
        type: string
      - description: Jenis, nomor, alasan, tenggat
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.IssueWarningRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.SPPGKitchen'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Terbitkan surat peringatan SP-1/SP-2
      tags:
      - sppg
  /validators/{id}/backup:
    put:
      consumes:
      - application/json
      description: Cadangan wajib validator aktif pada sekolah yang sama.
      parameters:
      - description: Validator ID
        example: VAL-001
        in: path
        name: id
        required: true
        type: string
      - description: ID cadangan + alasan
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.AssignBackupValidatorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.ValidatorProfile'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Tugaskan guru piket cadangan
      tags:
      - validators
  /validators/{id}/device/reset:
    post:
      consumes:
      - application/json
      description: Memutus tautan kriptografis perangkat; validator wajib registrasi
        ulang.
      parameters:
      - description: Validator ID
        example: VAL-001
        in: path
        name: id
        required: true
        type: string
      - description: Alasan reset
        in: body
        name: payload
        schema:
          $ref: '#/definitions/models.ResetValidatorDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.ValidatorProfile'
